<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="EasyDownloader logo">
  <defs>
    <linearGradient id="y" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD700"/><stop offset="1" stop-color="#FFC107"/>
    </linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1E1E"/><stop offset="1" stop-color="#121212"/>
    </linearGradient>
  </defs>
  <!-- rounded dark slate tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#d)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#FFD700" stroke-opacity=".25" stroke-width="2"/>
  <!-- play button ring -->
  <circle cx="128" cy="118" r="62" fill="none" stroke="url(#y)" stroke-width="10"/>
  <!-- play triangle -->
  <path d="M112 88 L162 118 L112 148 Z" fill="url(#y)"/>
  <!-- download arrow through the play circle -->
  <path d="M128 138 v44" stroke="#FFD700" stroke-width="12" stroke-linecap="round"/>
  <path d="M106 160 L128 184 L150 160" fill="none" stroke="#FFD700" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- soundwave bars -->
  <g stroke="url(#y)" stroke-width="7" stroke-linecap="round">
    <line x1="52" y1="118" x2="52" y2="118"/>
    <line x1="70" y1="106" x2="70" y2="130"/>
    <line x1="186" y1="106" x2="186" y2="130"/>
    <line x1="204" y1="118" x2="204" y2="118"/>
  </g>
  <!-- tray -->
  <path d="M72 196 h112" stroke="#FFD700" stroke-width="8" stroke-linecap="round"/>
</svg>
